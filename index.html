<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK Trainer Editor</title>
<meta name="theme-color" content="#12181a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OK Trainer">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{--chassis:#12181a;--panel:#1b2426;--panel-2:#212c2e;--border:#2a3436;--text:#eae6d9;--muted:#8b9a95;--accent:#ffb020;--green:#6fe3a0;--sans:-apple-system,"Segoe UI",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media(prefers-color-scheme:light){:root{--chassis:#eee8d9;--panel:#fff;--panel-2:#efe8d6;--border:#d9d2bd;--text:#2b2a25;--muted:#6b6558;--accent:#a85d00;--green:#1f8a5c}}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--chassis);color:var(--text);font-family:var(--sans);padding:24px 16px 48px;display:flex;justify-content:center}.wrap{width:100%;max-width:640px}header{text-align:center;margin:8px 0 32px}h1{font-family:Georgia,"Times New Roman",serif;font-size:28px;letter-spacing:2px;color:var(--accent);margin:0}.field{margin:0 0 22px}label{display:block;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.3px;margin:0 0 7px}input,textarea,select{width:100%;font:15px var(--sans);color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;outline:none}input,select{height:44px;padding:0 12px}textarea{min-height:110px;padding:12px;resize:vertical;line-height:1.45}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}.control-row{display:flex;gap:6px}.control-row select{flex:1;min-width:0}button{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:19px;cursor:pointer}button:hover{background:var(--panel-2)}button:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:default}.test-row{display:flex;align-items:flex-start;gap:8px}.test-row textarea{flex:1}.test-row input{flex:1;margin:0}.speak-btn{color:var(--green)}.status{min-height:18px;margin:4px 0 0;color:var(--muted);font-size:12px}.hidden{display:none}.nav-row{display:flex;gap:8px}.nav-row button{width:auto;flex:1;font-size:15px;font-family:var(--sans)}.position{text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;margin:0 0 14px}fieldset{border:1px solid var(--border);border-radius:8px;padding:14px;margin:0 0 22px}legend{padding:0 6px;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.3px}.divider{border:none;border-top:1px solid var(--border);margin:0 0 22px}
</style>
</head>
<body>
<main class="wrap">
  <header><h1>Flashcards Editor</h1></header>

  <div class="field">
    <label for="deckSelect">Balíček karet:</label>
    <div class="control-row">
      <select id="deckSelect" aria-label="Balíček karet"></select>
      <button id="importDeck" type="button" title="Importovat balíček JSON" aria-label="Importovat balíček JSON">📥</button>
      <button id="exportDeck" type="button" title="Exportovat balíček JSON" aria-label="Exportovat balíček JSON">📤</button>
      <input id="deckFile" class="hidden" type="file" accept="application/json,.json">
    </div>
  </div>
  <div class="field">
    <label for="deckShortName">Krátký název balíčku:</label>
    <input id="deckShortName" type="text" spellcheck="false">
  </div>
  <div class="field">
    <label for="deckShortNameTts">Krátký název — text pro TTS (nepovinné):</label>
    <div class="test-row">
      <input id="deckShortNameTts" type="text" placeholder="Prázdné = použije se krátký název výše" spellcheck="false">
      <button id="speakDeckShortName" class="speak-btn" type="button" title="Přehrát krátký název" aria-label="Přehrát krátký název">🔊</button>
    </div>
  </div>
  <div class="field">
    <label for="deckLongName">Popis balíčku:</label>
    <input id="deckLongName" type="text" spellcheck="false">
  </div>
  <div class="field">
    <label for="deckLongNameTts">Popis — text pro TTS (nepovinné):</label>
    <div class="test-row">
      <input id="deckLongNameTts" type="text" placeholder="Prázdné = použije se popis výše" spellcheck="false">
      <button id="speakDeckLongName" class="speak-btn" type="button" title="Přehrát popis" aria-label="Přehrát popis">🔊</button>
    </div>
  </div>
  <div class="field">
    <label for="deckLanguage">Jazyk balíčku (např. cs-CZ):</label>
    <input id="deckLanguage" type="text" spellcheck="false">
  </div>
  <hr class="divider">

  <div class="field">
    <label for="areaSelect">Oblast:</label>
    <div class="control-row">
      <select id="areaSelect" aria-label="Oblast"></select>
      <button id="addArea" type="button" title="Přidat oblast" aria-label="Přidat oblast">➕</button>
      <button id="deleteArea" type="button" title="Smazat oblast" aria-label="Smazat oblast">🗑️</button>
    </div>
  </div>
  <div class="field">
    <label for="areaNameInput">Název oblasti:</label>
    <input id="areaNameInput" type="text" spellcheck="false">
  </div>
  <div class="field">
    <label for="areaNameTtsInput">Název oblasti — text pro TTS (nepovinné):</label>
    <div class="test-row">
      <input id="areaNameTtsInput" type="text" placeholder="Prázdné = použije se název výše" spellcheck="false">
      <button id="speakAreaName" class="speak-btn" type="button" title="Přehrát název oblasti" aria-label="Přehrát název oblasti">🔊</button>
    </div>
  </div>
  <div class="field">
    <label for="maxErrorsInput">Max. počet chyb v oblasti (nepovinné):</label>
    <input id="maxErrorsInput" type="number" min="0" step="1">
  </div>
  <hr class="divider">

  <div class="field">
    <label for="subareaSelect">Podoblast:</label>
    <div class="control-row">
      <select id="subareaSelect" aria-label="Podoblast"></select>
      <button id="addSubarea" type="button" title="Přidat podoblast" aria-label="Přidat podoblast">➕</button>
      <button id="deleteSubarea" type="button" title="Smazat podoblast" aria-label="Smazat podoblast">🗑️</button>
    </div>
  </div>
  <div class="field">
    <label for="subareaNameInput">Název podoblasti:</label>
    <input id="subareaNameInput" type="text" spellcheck="false">
  </div>
  <div class="field">
    <label for="subareaNameTtsInput">Název podoblasti — text pro TTS (nepovinné):</label>
    <div class="test-row">
      <input id="subareaNameTtsInput" type="text" placeholder="Prázdné = použije se název výše" spellcheck="false">
      <button id="speakSubareaName" class="speak-btn" type="button" title="Přehrát název podoblasti" aria-label="Přehrát název podoblasti">🔊</button>
    </div>
  </div>
  <hr class="divider">

  <p id="cardPosition" class="position"></p>

  <div class="field nav-row">
    <button id="prevCard" type="button">◀ Předchozí</button>
    <button id="nextCard" type="button">Další ▶</button>
  </div>

  <div class="field">
    <label for="frontText">Přední strana — text:</label>
    <textarea id="frontText" spellcheck="false"></textarea>
  </div>
  <div class="field">
    <label for="frontTtsText">Přední strana — text pro TTS (nepovinné):</label>
    <div class="test-row">
      <textarea id="frontTtsText" placeholder="Prázdné = použije se text výše" spellcheck="false"></textarea>
      <button id="speakFront" class="speak-btn" type="button" title="Přehrát přední stranu" aria-label="Přehrát přední stranu">🔊</button>
    </div>
  </div>

  <div class="field">
    <label for="backText">Zadní strana — text:</label>
    <textarea id="backText" spellcheck="false"></textarea>
  </div>
  <div class="field">
    <label for="backTtsText">Zadní strana — text pro TTS (nepovinné):</label>
    <div class="test-row">
      <textarea id="backTtsText" placeholder="Prázdné = použije se text výše" spellcheck="false"></textarea>
      <button id="speakBack" class="speak-btn" type="button" title="Přehrát zadní stranu" aria-label="Přehrát zadní stranu">🔊</button>
    </div>
  </div>

  <fieldset>
    <legend>Nastavení TTS</legend>
    <div class="field" style="margin-bottom:0">
      <label for="spellingAlphabet">Hláskovací abeceda (pro značky {X}):</label>
      <div class="control-row">
        <select id="spellingAlphabet" aria-label="Hláskovací abeceda"></select>
        <button id="importSpelling" type="button" title="Importovat hláskovací abecedu" aria-label="Importovat hláskovací abecedu">📥</button>
        <input id="spellingFile" class="hidden" type="file" accept="application/json,.json">
      </div>
    </div>
  </fieldset>

  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<script>
const BUILTIN_SPELLING={spellId:"itu-en",spellName:"ITU/NATO English",lang:"en-US",letters:{A:"Alpha",B:"Bravo",C:"Charlie",D:"Delta",E:"Echo",F:"Foxtrot",G:"Golf",H:"Hotel",I:"India",J:"Juliett",K:"Kilo",L:"Lima",M:"Mike",N:"November",O:"Oscar",P:"Papa",Q:"Quebec",R:"Romeo",S:"Sierra",T:"Tango",U:"Uniform",V:"Victor",W:"Whisky",X:"X-ray",Y:"Yankee",Z:"Zulu",0:"Zero",1:"One",2:"Two",3:"Three",4:"Four",5:"Five",6:"Six",7:"Seven",8:"Eight",9:"Nine","-":"to","–":"to","?":"Question mark"}};
const SPELLING_KEY="ttsspeller_spelllib_v1";const ACTIVE_SPELLING_KEY="ttsspeller_activespell_v1";
const FLASHCARD_KEY="oktrainer_flashcards_v1";const POSITION_KEY="oktrainer_position_v1";
const BUNDLED_SPELLING_FILES=["SpellingAlphabets/English NATO ITU spelling.json","SpellingAlphabets/Česká hlásková abeceda.json"];
const BUNDLED_FLASHCARD_FILES=["Flashcards/Český test ČTÚ pro HAREC A.json","Flashcards/Český návod.json","Flashcards/English Tutorial.json"];

const deckSelect=document.getElementById("deckSelect");
const deckShortNameInput=document.getElementById("deckShortName");
const deckShortNameTtsInput=document.getElementById("deckShortNameTts");
const speakDeckShortNameBtn=document.getElementById("speakDeckShortName");
const deckLongNameInput=document.getElementById("deckLongName");
const deckLongNameTtsInput=document.getElementById("deckLongNameTts");
const speakDeckLongNameBtn=document.getElementById("speakDeckLongName");
const deckLanguageInput=document.getElementById("deckLanguage");
const areaSelect=document.getElementById("areaSelect");
const areaNameInput=document.getElementById("areaNameInput");
const areaNameTtsInput=document.getElementById("areaNameTtsInput");
const speakAreaNameBtn=document.getElementById("speakAreaName");
const maxErrorsInput=document.getElementById("maxErrorsInput");
const addAreaBtn=document.getElementById("addArea");
const deleteAreaBtn=document.getElementById("deleteArea");
const subareaSelect=document.getElementById("subareaSelect");
const subareaNameInput=document.getElementById("subareaNameInput");
const subareaNameTtsInput=document.getElementById("subareaNameTtsInput");
const speakSubareaNameBtn=document.getElementById("speakSubareaName");
const addSubareaBtn=document.getElementById("addSubarea");
const deleteSubareaBtn=document.getElementById("deleteSubarea");
const cardPosition=document.getElementById("cardPosition");
const prevCardBtn=document.getElementById("prevCard");
const nextCardBtn=document.getElementById("nextCard");
const frontText=document.getElementById("frontText");
const frontTtsText=document.getElementById("frontTtsText");
const backText=document.getElementById("backText");
const backTtsText=document.getElementById("backTtsText");
const speakFrontBtn=document.getElementById("speakFront");
const speakBackBtn=document.getElementById("speakBack");
const alphabetSelect=document.getElementById("spellingAlphabet");
const status=document.getElementById("status");

// --- Spelling alphabets (used for {X} markers inside card TTS text) ---
function loadSpellingLibrary(){try{const library=JSON.parse(localStorage.getItem(SPELLING_KEY)||"{}");library[BUILTIN_SPELLING.spellId]=library[BUILTIN_SPELLING.spellId]||BUILTIN_SPELLING;return library}catch(e){return {[BUILTIN_SPELLING.spellId]:BUILTIN_SPELLING}}}
let spellingLibrary=loadSpellingLibrary();let activeSpellingId=localStorage.getItem(ACTIVE_SPELLING_KEY)||BUILTIN_SPELLING.spellId;if(!spellingLibrary[activeSpellingId])activeSpellingId=BUILTIN_SPELLING.spellId;
function saveSpellingLibrary(){try{localStorage.setItem(SPELLING_KEY,JSON.stringify(spellingLibrary))}catch(e){}}
async function loadBundledSpelling(){
  const packs=await Promise.all(BUNDLED_SPELLING_FILES.map(async file=>{try{const response=await fetch(file);return response.ok?response.json():null}catch(e){return null}}));
  let changed=false;
  packs.filter(Boolean).forEach(pack=>{if(pack.spellId&&pack.spellName&&pack.lang&&pack.letters&&JSON.stringify(spellingLibrary[pack.spellId])!==JSON.stringify(pack)){spellingLibrary[pack.spellId]=pack;changed=true}});
  if(changed){saveSpellingLibrary();renderSpellingAlphabets()}
}
function renderSpellingAlphabets(){const ids=Object.keys(spellingLibrary).sort((a,b)=>a===BUILTIN_SPELLING.spellId?-1:b===BUILTIN_SPELLING.spellId?1:a.localeCompare(b));alphabetSelect.replaceChildren(...ids.map(id=>{const option=document.createElement("option");option.value=id;option.textContent=spellingLibrary[id].spellName||id;return option}));alphabetSelect.value=activeSpellingId}
alphabetSelect.addEventListener("change",()=>{activeSpellingId=alphabetSelect.value;try{localStorage.setItem(ACTIVE_SPELLING_KEY,activeSpellingId)}catch(e){}});
document.getElementById("importSpelling").addEventListener("click",()=>document.getElementById("spellingFile").click());
document.getElementById("spellingFile").addEventListener("change",event=>{const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const pack=JSON.parse(reader.result);if(!pack||typeof pack.spellId!=="string"||typeof pack.spellName!=="string"||typeof pack.lang!=="string"||!pack.letters||typeof pack.letters!=="object")throw new Error("Neplatný formát hláskovací abecedy");spellingLibrary[pack.spellId]=pack;activeSpellingId=pack.spellId;saveSpellingLibrary();renderSpellingAlphabets()}catch(error){window.alert(error.message)}event.target.value=""};reader.readAsText(file,"utf-8")});
function buildSpeechSegments(text, language){
  const alphabet=spellingLibrary[activeSpellingId]||BUILTIN_SPELLING;
  const segments=[];
  const marker=/\{([^{}]*)\}/g;
  let position=0;
  let match;
  while((match=marker.exec(text))){
    if(match.index>position) segments.push({text:text.slice(position,match.index),lang:language});
    const marked=match[1];
    if(/[\p{L}\p{N}]/u.test(marked)){
      const spelled=Array.from(marked).map(character=>alphabet.letters[character]||alphabet.letters[character.toUpperCase()]||character).join(" ");
      segments.push({text:spelled,lang:alphabet.lang});
    }else{
      segments.push({text:match[0],lang:language});
    }
    position=match.index+match[0].length;
  }
  if(position<text.length) segments.push({text:text.slice(position),lang:language});
  const merged=[];
  for(const segment of segments){
    const last=merged[merged.length-1];
    if(last&&last.lang.toLowerCase()===segment.lang.toLowerCase())last.text+=segment.text;
    else merged.push({text:segment.text,lang:segment.lang});
  }
  return merged.filter(segment=>segment.text);
}
function speakSegments(segments, index=0){
  if(index>=segments.length){status.textContent="";return}
  const utterance=new SpeechSynthesisUtterance(segments[index].text);
  utterance.lang=segments[index].lang;
  const voices=window.speechSynthesis.getVoices();
  const language=segments[index].lang.toLowerCase();
  const voice=voices.find(candidate=>candidate.lang.toLowerCase()===language)||voices.find(candidate=>candidate.lang.toLowerCase().startsWith(language.split("-")[0]+"-"));
  if(voice)utterance.voice=voice;
  utterance.onend=()=>speakSegments(segments,index+1);
  utterance.onerror=()=>{status.textContent="Přehrávání se nezdařilo."};
  window.speechSynthesis.speak(utterance);
}
function speak(text,language){
  if(!text||!language)return;
  if(!("speechSynthesis" in window)){status.textContent="Tento prohlížeč nepodporuje syntézu řeči.";return}
  window.speechSynthesis.cancel();status.textContent="Přehrávám...";speakSegments(buildSpeechSegments(text,language));
}

// --- Flashcard decks ---
function loadFlashcardLibrary(){try{return JSON.parse(localStorage.getItem(FLASHCARD_KEY)||"{}")}catch(e){return {}}}
function saveFlashcardLibrary(){try{localStorage.setItem(FLASHCARD_KEY,JSON.stringify(flashcardLibrary))}catch(e){}}
function loadPosition(){try{return JSON.parse(localStorage.getItem(POSITION_KEY))||null}catch(e){return null}}
function savePosition(){try{localStorage.setItem(POSITION_KEY,JSON.stringify(position))}catch(e){}}

let flashcardLibrary=loadFlashcardLibrary();
let position=loadPosition()||{deckId:null,areaIndex:0,subareaIndex:0,cardIndex:0};

function isOptionalString(value){return value===undefined||typeof value==="string"}
function isValidDeck(deck){
  return !!deck&&typeof deck.shortName==="string"&&typeof deck.longName==="string"&&typeof deck.language==="string"&&
    isOptionalString(deck.shortNameTts)&&isOptionalString(deck.longNameTts)&&
    Array.isArray(deck.areas)&&deck.areas.length>0&&
    deck.areas.every(area=>area&&typeof area.name==="string"&&
      isOptionalString(area.nameTts)&&(area.maxErrors===undefined||typeof area.maxErrors==="number")&&
      Array.isArray(area.subareas)&&area.subareas.length>0&&
      area.subareas.every(subarea=>subarea&&typeof subarea.name==="string"&&
        isOptionalString(subarea.nameTts)&&
        Array.isArray(subarea.cards)&&subarea.cards.length>0&&
        subarea.cards.every(card=>card&&typeof card.front==="string"&&typeof card.back==="string"&&
          isOptionalString(card.frontTts)&&isOptionalString(card.backTts))));
}
function frontSpeechOf(card){return (card.frontTts||"").trim()||card.front}
function backSpeechOf(card){return (card.backTts||"").trim()||card.back}
function shortNameSpeechOf(deck){return (deck.shortNameTts||"").trim()||deck.shortName}
function longNameSpeechOf(deck){return (deck.longNameTts||"").trim()||deck.longName}
function areaNameSpeechOf(area){return (area.nameTts||"").trim()||area.name}
function subareaNameSpeechOf(subarea){return (subarea.nameTts||"").trim()||subarea.name}

function getDeck(){return position.deckId?flashcardLibrary[position.deckId]:null}
function clampPosition(){
  const deck=getDeck();
  if(!deck)return;
  position.areaIndex=Math.min(Math.max(position.areaIndex,0),deck.areas.length-1);
  const area=deck.areas[position.areaIndex];
  position.subareaIndex=Math.min(Math.max(position.subareaIndex,0),area.subareas.length-1);
  const subarea=area.subareas[position.subareaIndex];
  position.cardIndex=Math.min(Math.max(position.cardIndex,0),subarea.cards.length-1);
}

function renderDeckSelect(){
  const ids=Object.keys(flashcardLibrary).sort((a,b)=>a.localeCompare(b));
  deckSelect.replaceChildren(...ids.map(id=>{const option=document.createElement("option");option.value=id;option.textContent=flashcardLibrary[id].longName||id;return option}));
  if(ids.length)deckSelect.value=position.deckId&&flashcardLibrary[position.deckId]?position.deckId:ids[0];
}

function generateUniqueName(existingNames,base){
  if(!existingNames.includes(base))return base;
  let n=2;
  while(existingNames.includes(`${base} ${n}`))n++;
  return `${base} ${n}`;
}

function renderNavSelects(){
  const deck=getDeck();
  const hasDeck=!!deck;
  areaSelect.disabled=subareaSelect.disabled=prevCardBtn.disabled=nextCardBtn.disabled=
    speakFrontBtn.disabled=speakBackBtn.disabled=exportDeckBtn.disabled=
    deckShortNameInput.disabled=deckShortNameTtsInput.disabled=speakDeckShortNameBtn.disabled=
    deckLongNameInput.disabled=deckLongNameTtsInput.disabled=speakDeckLongNameBtn.disabled=
    deckLanguageInput.disabled=
    areaNameInput.disabled=areaNameTtsInput.disabled=speakAreaNameBtn.disabled=maxErrorsInput.disabled=
    addAreaBtn.disabled=deleteAreaBtn.disabled=
    subareaNameInput.disabled=subareaNameTtsInput.disabled=speakSubareaNameBtn.disabled=
    addSubareaBtn.disabled=deleteSubareaBtn.disabled=!hasDeck;
  if(!hasDeck){
    areaSelect.replaceChildren();subareaSelect.replaceChildren();
    deckShortNameInput.value=deckShortNameTtsInput.value=deckLongNameInput.value=deckLongNameTtsInput.value=deckLanguageInput.value="";
    areaNameInput.value=areaNameTtsInput.value=maxErrorsInput.value=subareaNameInput.value=subareaNameTtsInput.value="";
    return;
  }
  deckShortNameInput.value=deck.shortName;
  deckShortNameTtsInput.value=deck.shortNameTts||"";
  deckLongNameInput.value=deck.longName;
  deckLongNameTtsInput.value=deck.longNameTts||"";
  deckLanguageInput.value=deck.language;
  areaSelect.replaceChildren(...deck.areas.map((area,index)=>{const option=document.createElement("option");option.value=index;option.textContent=area.name;return option}));
  areaSelect.value=position.areaIndex;
  const area=deck.areas[position.areaIndex];
  areaNameInput.value=area.name;
  areaNameTtsInput.value=area.nameTts||"";
  maxErrorsInput.value=area.maxErrors===undefined?"":area.maxErrors;
  subareaSelect.replaceChildren(...area.subareas.map((subarea,index)=>{const option=document.createElement("option");option.value=index;option.textContent=subarea.name;return option}));
  subareaSelect.value=position.subareaIndex;
  const subarea=area.subareas[position.subareaIndex];
  subareaNameInput.value=subarea.name;
  subareaNameTtsInput.value=subarea.nameTts||"";
}

function renderCard(){
  const deck=getDeck();
  const editable=[frontText,frontTtsText,backText,backTtsText];
  if(!deck){
    cardPosition.textContent="Nejsou načteny žádné balíčky karet.";
    editable.forEach(field=>{field.value="";field.disabled=true});
    return;
  }
  editable.forEach(field=>field.disabled=false);
  const area=deck.areas[position.areaIndex];
  const subarea=area.subareas[position.subareaIndex];
  const card=subarea.cards[position.cardIndex];
  cardPosition.textContent=`${area.name} › ${subarea.name} — karta ${position.cardIndex+1}/${subarea.cards.length}`;
  frontText.value=card.front;
  frontTtsText.value=card.frontTts||"";
  backText.value=card.back;
  backTtsText.value=card.backTts||"";
}

function renderAll(){clampPosition();renderNavSelects();renderCard();savePosition()}

deckSelect.addEventListener("change",()=>{position={deckId:deckSelect.value,areaIndex:0,subareaIndex:0,cardIndex:0};renderAll()});
areaSelect.addEventListener("change",()=>{position.areaIndex=Number(areaSelect.value);position.subareaIndex=0;position.cardIndex=0;renderAll()});
subareaSelect.addEventListener("change",()=>{position.subareaIndex=Number(subareaSelect.value);position.cardIndex=0;renderAll()});

deckShortNameInput.addEventListener("change",()=>{
  const deck=getDeck();if(!deck)return;
  const newId=deckShortNameInput.value.trim();
  if(!newId){deckShortNameInput.value=deck.shortName;return}
  if(newId===deck.shortName)return;
  if(flashcardLibrary[newId]){window.alert("Balíček s tímto krátkým názvem už existuje.");deckShortNameInput.value=deck.shortName;return}
  delete flashcardLibrary[deck.shortName];
  deck.shortName=newId;
  flashcardLibrary[newId]=deck;
  position.deckId=newId;
  saveFlashcardLibrary();
  renderDeckSelect();
  savePosition();
});
deckLongNameInput.addEventListener("input",()=>{
  const deck=getDeck();if(!deck)return;
  deck.longName=deckLongNameInput.value;
  saveFlashcardLibrary();
  const option=deckSelect.querySelector(`option[value="${CSS.escape(deck.shortName)}"]`);
  if(option)option.textContent=deck.longName;
});

maxErrorsInput.addEventListener("input",()=>{
  const deck=getDeck();if(!deck)return;
  const area=deck.areas[position.areaIndex];

  else{const n=parseInt(raw,10);if(!Number.isNaN(n))area.maxErrors=n}

addAreaBtn.addEventListener("click",()=>{
  const deck=getDeck();if(!deck)return;
  const name=generateUniqueName(deck.areas.map(a=>a.name),"Nová oblast");
  deck.areas.push({name,subareas:[{name:"Nová podoblast",cards:[{front:"",back:""}]}]});
  position.areaIndex=deck.areas.length-1;position.subareaIndex=0;position.cardIndex=0;
  saveFlashcardLibrary();
  renderAll();
});
deleteAreaBtn.addEventListener("click",()=>{
  const deck=getDeck();if(!deck)return;
  if(deck.areas.length<=1){window.alert("Balíček musí obsahovat alespoň jednu oblast.");return}
  const area=deck.areas[position.areaIndex];
  if(!window.confirm(`Opravdu smazat oblast „${area.name}“ včetně všech jejích karet?`))return;
  deck.areas.splice(position.areaIndex,1);
  position.areaIndex=Math.min(position.areaIndex,deck.areas.length-1);
  position.subareaIndex=0;position.cardIndex=0;
  saveFlashcardLibrary();
  renderAll();
});

addSubareaBtn.addEventListener("click",()=>{
  const deck=getDeck();if(!deck)return;
  const area=deck.areas[position.areaIndex];
  const name=generateUniqueName(area.subareas.map(s=>s.name),"Nová podoblast");
  area.subareas.push({name,cards:[{front:"",back:""}]});
  position.subareaIndex=area.subareas.length-1;position.cardIndex=0;
  saveFlashcardLibrary();
  renderAll();
});
deleteSubareaBtn.addEventListener("click",()=>{
  const deck=getDeck();if(!deck)return;
  const area=deck.areas[position.areaIndex];
  if(area.subareas.length<=1){window.alert("Oblast musí obsahovat alespoň jednu podoblast.");return}
  const subarea=area.subareas[position.subareaIndex];
  if(!window.confirm(`Opravdu smazat podoblast „${subarea.name}“ včetně všech jejích karet?`))return;
  area.subareas.splice(position.subareaIndex,1);
  position.subareaIndex=Math.min(position.subareaIndex,area.subareas.length-1);
  position.cardIndex=0;
  saveFlashcardLibrary();
  renderAll();
});

function nextCard(){
  const deck=getDeck();if(!deck)return;
  const area=deck.areas[position.areaIndex];
  const subarea=area.subareas[position.subareaIndex];
  if(position.cardIndex<subarea.cards.length-1){position.cardIndex++;renderAll();return}
  if(position.subareaIndex<area.subareas.length-1){position.subareaIndex++;position.cardIndex=0;renderAll();return}
  if(position.areaIndex<deck.areas.length-1){position.areaIndex++;position.subareaIndex=0;position.cardIndex=0;renderAll();return}
  position.areaIndex=0;position.subareaIndex=0;position.cardIndex=0;renderAll();
}
function previousCard(){
  const deck=getDeck();if(!deck)return;
  if(position.cardIndex>0){position.cardIndex--;renderAll();return}
  const area=deck.areas[position.areaIndex];
  if(position.subareaIndex>0){position.subareaIndex--;position.cardIndex=area.subareas[position.subareaIndex].cards.length-1;renderAll();return}
  if(position.areaIndex>0){
    position.areaIndex--;
    const previousArea=deck.areas[position.areaIndex];
    position.subareaIndex=previousArea.subareas.length-1;
    position.cardIndex=previousArea.subareas[position.subareaIndex].cards.length-1;
    renderAll();return
  }
  position.areaIndex=deck.areas.length-1;
  const lastArea=deck.areas[position.areaIndex];
  position.subareaIndex=lastArea.subareas.length-1;
  position.cardIndex=lastArea.subareas[position.subareaIndex].cards.length-1;
  renderAll();
}
prevCardBtn.addEventListener("click",previousCard);
nextCardBtn.addEventListener("click",nextCard);

function updateCardField(field,value){
  const deck=getDeck();if(!deck)return;
  const card=deck.areas[position.areaIndex].subareas[position.subareaIndex].cards[position.cardIndex];
  card[field]=value;
  saveFlashcardLibrary();
}
frontText.addEventListener("input",()=>updateCardField("front",frontText.value));
frontTtsText.addEventListener("input",()=>updateCardField("frontTts",frontTtsText.value));
backText.addEventListener("input",()=>updateCardField("back",backText.value));
backTtsText.addEventListener("input",()=>updateCardField("backTts",backTtsText.value));

const importDeckBtn=document.getElementById("importDeck");
const exportDeckBtn=document.getElementById("exportDeck");
const deckFile=document.getElementById("deckFile");
importDeckBtn.addEventListener("click",()=>deckFile.click());
deckFile.addEventListener("change",event=>{
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const deck=JSON.parse(reader.result);
      if(!isValidDeck(deck))throw new Error("Neplatný formát balíčku flashcards");
      flashcardLibrary[deck.shortName]=deck;
      saveFlashcardLibrary();
      position={deckId:deck.shortName,areaIndex:0,subareaIndex:0,cardIndex:0};
      renderDeckSelect();
      renderAll();
      status.textContent=`Balíček „${deck.longName}“ byl naimportován.`;
    }catch(error){window.alert(error.message)}
    event.target.value="";
  };
  reader.readAsText(file,"utf-8");
});
exportDeckBtn.addEventListener("click",()=>{
  const deck=getDeck();if(!deck)return;
  const blob=new Blob([JSON.stringify(deck,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=`${deck.shortName||"flashcards"}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
});

async function loadBundledFlashcards(){
  const decks=await Promise.all(BUNDLED_FLASHCARD_FILES.map(async file=>{try{const response=await fetch(file);return response.ok?response.json():null}catch(e){return null}}));
  let changed=false;
  decks.filter(Boolean).forEach(deck=>{
    if(isValidDeck(deck)&&!flashcardLibrary[deck.shortName]){flashcardLibrary[deck.shortName]=deck;changed=true}
  });
  if(changed)saveFlashcardLibrary();
  if(!position.deckId||!flashcardLibrary[position.deckId]){
    const ids=Object.keys(flashcardLibrary);
    if(ids.length)position={deckId:ids[0],areaIndex:0,subareaIndex:0,cardIndex:0};
  }
  renderDeckSelect();
  renderAll();
}

renderSpellingAlphabets();loadBundledSpelling();
renderDeckSelect();renderAll();loadBundledFlashcards();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
